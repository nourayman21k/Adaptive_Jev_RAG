services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: adaptive-rag-backend
    env_file:
      - path: .env  # needs GROQ_API_KEY; without it the API can still route but not answer
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: adaptive-rag-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
